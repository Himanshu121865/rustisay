<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rustisay — ASCII art in the browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>rustisay <span>web demo</span></h1>
    <p>Images, GIFs, APNGs and animated WebPs → colored ASCII art in your terminal — now in your browser.</p>
  </header>

  <main>
    <section id="dropzone" tabindex="0">
      <p>Drop an image, GIF, APNG or WebP here</p>
      <p class="hint">or click to browse</p>
      <input type="file" id="file-input" accept="image/*,.gif,.apng,.webp,.png,.jpg,.jpeg,.bmp" hidden />
    </section>

    <section id="controls">
      <label>Width (0 = auto)
        <input type="number" id="ctl-width" value="0" min="0" max="400" />
      </label>
      <label>Charset
        <select id="ctl-charset">
          <option value="alphabet" selected>alphabet</option>
          <option value="fast">fast</option>
          <option value="letters">letters</option>
          <option value="lowercase">lowercase</option>
          <option value="minimal">minimal</option>
          <option value="symbols">symbols</option>
          <option value="uppercase">uppercase</option>
        </select>
      </label>
      <label>Brightness
        <input type="range" id="ctl-brightness" value="0" min="-1" max="1" step="0.05" />
        <output id="out-brightness">0.00</output>
      </label>
      <label>Contrast
        <input type="range" id="ctl-contrast" value="1" min="0.1" max="3" step="0.1" />
        <output id="out-contrast">1.00</output>
      </label>
      <label class="check"><input type="checkbox" id="ctl-invert" /> Invert</label>
      <label class="check"><input type="checkbox" id="ctl-bw" /> Monochrome</label>
      <label>GIF bg color
        <input type="text" id="ctl-bg" value="black" size="14" spellcheck="false" />
      </label>
      <label>GIF repeat
        <input type="number" id="ctl-repeat" value="0" min="0" max="65535" />
      </label>
      <button id="btn-convert" disabled>Convert</button>
    </section>

    <section id="status" hidden>
      <div id="stat-text"></div>
      <div id="actions">
        <button id="btn-play" disabled>Play</button>
        <button id="btn-dl-gif" disabled>Download GIF</button>
        <button id="btn-dl-txt" disabled>Download TXT</button>
      </div>
      <div id="frame-count"></div>
    </section>

    <section id="stage">
      <pre id="pre" hidden></pre>
      <p id="error" hidden></p>
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
